[project]
name = "arkive-rag"
version = "0.3.0"
description = "Compile curated documents into read-only SQLite knowledge snapshots served over MCP"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mcp==2.2.0",
    "numpy==2.5.3",
    "openai==3.51.0",
    "openai-agents==0.24.0",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pypdfium2==5.13.0",
    "typer==0.26.8",
]

[project.scripts]
arkive-rag = "arkive_rag.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arkive_rag"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "evals"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
