[project]
name = "arkive-rag"
version = "0.1.0"
description = "Arkive RAG: RAG implementation for ETL classification and document services"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arkive_rag"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
