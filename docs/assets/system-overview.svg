<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-overview-title system-overview-desc" id="system-overview-root">
        <title id="system-overview-title">Arkive RAG System Overview</title>
        <desc id="system-overview-desc">Source documents, optional curator notes and a build cache are compiled once, with OpenAI build-time calls, into a portable read-only snapshot file that a local MCP server serves to an AI assistant through eleven read and draft tools.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #system-overview-root { --color-paper:       #F4F1EA;
      --color-paper-2:     #E9E4D8;
      --color-ink:         #1D232A;
      --color-muted:       #47525E;
      --color-soft:        #4F5B66;
      --color-accent:      #B03F1B;
      --color-accent-tint: rgba(176, 63, 27, 0.08);
      --color-link:        #1B5E63;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace; }
      #system-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #system-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      #system-overview-root .diagram-container { overflow-x: visible; }</style>
          <marker id="system-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
