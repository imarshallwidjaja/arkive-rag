          </marker>
          <marker id="system-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#B03F1B"/>
          </marker>
          <marker id="system-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1B5E63"/>
          </marker>
        </defs>

        <!-- Clean archival paper ground -->
        <rect width="100%" height="100%" fill="#F4F1EA"/>

