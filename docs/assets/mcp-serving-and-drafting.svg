      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #mcp-serving-and-drafting-root { --color-paper:       #F4F1EA;
      --color-paper-2:     #E9E4D8;
      --color-ink:         #1D232A;
      --color-muted:       #47525E;
      --color-soft:        #4F5B66;
      --color-accent:      #B03F1B;
      --color-accent-tint: rgba(176, 63, 27, 0.08);
      --color-link:        #1B5E63;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace; }
      #mcp-serving-and-drafting-root { font-family: var(--font-sans); color: var(--color-ink); }
      #mcp-serving-and-drafting-root .diagram-container { width: 100%; overflow-x: auto; }
      #mcp-serving-and-drafting-root .diagram-container { overflow-x: visible; }</style>
