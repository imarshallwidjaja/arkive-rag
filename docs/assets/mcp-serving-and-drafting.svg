<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-serving-and-drafting-title mcp-serving-and-drafting-desc" id="mcp-serving-and-drafting-root">
        <title id="mcp-serving-and-drafting-title">Arkive MCP Serving and Drafting Packet</title>
        <desc id="mcp-serving-and-drafting-desc">Runtime serving diagram showing how an AI agent routes through either the pinpoint Q&amp;A tools or the prepare_draft 45,000-byte drafting packet builder with outline caps, inline prose reserves, and recurrence provenance.</desc>
