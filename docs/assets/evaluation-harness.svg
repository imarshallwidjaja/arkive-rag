        <rect x="44" y="196" width="168" height="84" rx="6" fill="#F4F1EA"/>
        <rect x="44" y="196" width="168" height="84" rx="6" fill="#E9E4D8" stroke="#1D232A" stroke-width="1.2"/>
        <rect x="52" y="204" width="38" height="12" rx="2" fill="none" stroke="#1d232a" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="71" y="213" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="128" y="236" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Preflight Checks</text>
        <text x="128" y="252" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">before any spend</text>
        <text x="128" y="266" fill="#4F5B66" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">anchors · leaks · paths</text>

        <!-- 3. Raw Corpus -->
        <rect x="44" y="328" width="168" height="80" rx="6" fill="#F4F1EA"/>
        <rect x="44" y="328" width="168" height="80" rx="6" fill="#F4F1EA" stroke="#1D232A" stroke-width="1"/>
        <rect x="52" y="336" width="44" height="12" rx="2" fill="none" stroke="#1d232a" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="74" y="345" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="128" y="368" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Corpus Folder</text>
        <text x="128" y="384" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">raw files baseline</text>
        <text x="128" y="398" fill="#4F5B66" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 public collections</text>

        <!-- 4. Layer 1 -->
        <rect x="296" y="64" width="368" height="64" rx="6" fill="#F4F1EA"/>
        <rect x="296" y="64" width="368" height="64" rx="6" fill="#F4F1EA" stroke="#1D232A" stroke-width="1"/>
        <rect x="304" y="72" width="24" height="12" rx="2" fill="none" stroke="#1d232a" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="316" y="81" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
        <text x="480" y="96" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Layer 1 · Retrieval Ablation</text>
        <text x="480" y="114" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bm25 · dense · hybrid_rrf · served_search · Completion@k</text>

        <!-- 5. Layer 2 -->
        <rect x="296" y="152" width="368" height="64" rx="6" fill="#F4F1EA"/>
        <rect x="296" y="152" width="368" height="64" rx="6" fill="#F4F1EA" stroke="#1D232A" stroke-width="1"/>
        <rect x="304" y="160" width="24" height="12" rx="2" fill="none" stroke="#1d232a" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="316" y="169" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
        <text x="480" y="184" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Layer 2 · Grounded Q&amp;A</text>
        <text x="480" y="202" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">raw_files vs arkive_mcp · anchored claim-level judge</text>

        <!-- 6. Layer 3 (FOCAL ACCENT) -->
        <rect x="296" y="240" width="368" height="80" rx="6" fill="#F4F1EA"/>
        <rect x="296" y="240" width="368" height="80" rx="6" fill="#b03f1b" fill-opacity="0.08" stroke="#B03F1B" stroke-width="1.5"/>
        <rect x="304" y="248" width="24" height="12" rx="2" fill="none" stroke="#b03f1b" stroke-opacity="0.45" stroke-width="0.8"/>
        <text x="316" y="257" fill="#B03F1B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">L3</text>
        <text x="480" y="276" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Layer 3 · 5-Arm Holdout Drafting</text>
        <text x="480" y="294" fill="#B03F1B" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">zero · chunk · raw · mcp · oracle (5 rounds each)</text>
        <text x="480" y="308" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">house recall · contamination · rubric · blind judge</text>

        <!-- 7. OpenCode Container Check -->
        <rect x="296" y="344" width="368" height="68" rx="6" fill="#F4F1EA"/>
        <rect x="296" y="344" width="368" height="68" rx="6" fill="#1b5e63" fill-opacity="0.06" stroke="#1B5E63" stroke-width="1"/>
        <rect x="304" y="352" width="46" height="12" rx="2" fill="none" stroke="#1b5e63" stroke-opacity="0.45" stroke-width="0.8"/>
        <text x="327" y="361" fill="#1B5E63" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DOCKER</text>
        <text x="480" y="378" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenCode Live Acceptance Check</text>
        <text x="480" y="396" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OpenCode 2.3.0 · 10 scenarios · zero truncation gate</text>

        <!-- 8. Atomic Reports -->
        <rect x="736" y="188" width="200" height="96" rx="6" fill="#F4F1EA"/>
        <rect x="736" y="188" width="200" height="96" rx="6" fill="#E9E4D8" stroke="#1D232A" stroke-width="1.2"/>
        <rect x="744" y="196" width="46" height="12" rx="2" fill="none" stroke="#1d232a" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="767" y="205" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REPORT</text>
        <text x="836" y="232" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Atomic Private Output</text>
        <text x="836" y="250" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">results.json · report.md</text>
        <text x="836" y="266" fill="#4F5B66" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mode 0600 · blind drafts</text>

        <!-- LEGEND STRIP -->
        <line x1="24" y1="472" x2="936" y2="472" stroke="#1d232a" stroke-opacity="0.14" stroke-width="0.8"/>
