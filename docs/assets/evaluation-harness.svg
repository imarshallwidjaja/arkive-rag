        <rect x="108" y="482" width="14" height="12" rx="3" fill="#b03f1b" fill-opacity="0.08" stroke="#B03F1B" stroke-width="1.2"/>
        <text x="130" y="492" fill="#1D232A" font-size="9" font-family="'Geist', system-ui, sans-serif">Focal drafting benchmark</text>

        <rect x="316" y="482" width="14" height="12" rx="3" fill="#1b5e63" fill-opacity="0.06" stroke="#1B5E63" stroke-width="1"/>
        <text x="338" y="492" fill="#1D232A" font-size="9" font-family="'Geist', system-ui, sans-serif">Containerised client check</text>

        <rect x="540" y="482" width="14" height="12" rx="3" fill="#E9E4D8" stroke="#1D232A" stroke-width="1"/>
        <text x="562" y="492" fill="#1D232A" font-size="9" font-family="'Geist', system-ui, sans-serif">Preflight gate &amp; atomic output</text>
      </svg>
