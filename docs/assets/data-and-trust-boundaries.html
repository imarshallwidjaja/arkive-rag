<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkive RAG Data and Trust Boundaries</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #F4F1EA;
      --color-paper-2:     #E9E4D8;
      --color-ink:         #1D232A;
      --color-muted:       #47525E;
      --color-soft:        #4F5B66;
      --color-accent:      #B03F1B;
      --color-accent-tint: rgba(176, 63, 27, 0.08);
      --color-link:        #1B5E63;
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1040px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.1rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Your documents stay local; build and optional query embeddings call OpenAI</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-and-trust-boundaries-title data-and-trust-boundaries-desc">
        <title id="data-and-trust-boundaries-title">Arkive RAG Data and Trust Boundaries</title>
        <desc id="data-and-trust-boundaries-desc">Documents, the build cache, the read-only snapshot, the local MCP server and the AI assistant stay in the local environment; OpenAI is called during the build and, when a key is configured, to embed a search query or draft brief at serve time; ten of the eleven tools also work offline.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#47525E"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#B03F1B"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1B5E63"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#F4F1EA"/>

        <!-- ZONES (painted first) -->
        <rect x="24" y="24" width="664" height="496" rx="8" fill="rgba(29,35,42,0.025)" stroke="rgba(29,35,42,0.14)" stroke-width="0.8"/>
        <rect x="36" y="28" width="252" height="14" rx="2" fill="#F4F1EA"/>
        <text x="162" y="38" fill="#4F5B66" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR LOCAL ENVIRONMENT · PRIVATE MACHINE</text>

        <rect x="736" y="24" width="200" height="496" rx="8" fill="rgba(27,94,99,0.03)" stroke="rgba(27,94,99,0.35)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="748" y="28" width="132" height="14" rx="2" fill="#F4F1EA"/>
        <text x="814" y="38" fill="#4F5B66" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL API · OPENAI</text>

        <!-- Trust boundary line between the zones -->
        <line x1="712" y1="24" x2="712" y2="520" stroke="#47525E" stroke-width="1" stroke-dasharray="2,4"/>
        <rect x="672" y="526" width="80" height="14" rx="2" fill="#F4F1EA"/>
        <text x="712" y="536" fill="#4F5B66" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TRUST BOUNDARY</text>

        <!-- CONNECTORS (painted before nodes, orthogonal r=8 only) -->
        <!-- Curated Folder -> Snapshot Builder (straight horizontal at y=124) -->
        <line x1="212" y1="124" x2="272" y2="124" stroke="#47525E" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Build Cache -> Snapshot Builder (right-up elbow via x=242) -->
        <path d="M 212,220 H 234 Q 242,220 242,212 V 180 Q 242,172 250,172 H 272" fill="none" stroke="#47525E" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Snapshot Builder -> OpenAI API (build only, straight horizontal at y=124) -->
        <line x1="456" y1="124" x2="752" y2="124" stroke="#1B5E63" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="544" y="102" width="64" height="14" rx="2" fill="#F4F1EA"/>
        <text x="576" y="112" fill="#1B5E63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BUILD ONLY</text>
        <rect x="508" y="132" width="136" height="30" rx="2" fill="#F4F1EA"/>
        <text x="576" y="143" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pages &amp; indexing · cached</text>
        <text x="576" y="157" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">--max-cost cap</text>

        <!-- Snapshot Builder -> Read-Only Snapshot (accent, straight vertical at x=364) -->
        <line x1="364" y1="196" x2="364" y2="288" stroke="#B03F1B" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <rect x="372" y="236" width="40" height="14" rx="2" fill="#F4F1EA"/>
        <text x="392" y="246" fill="#B03F1B" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

        <!-- Read-Only Snapshot -> Local MCP Server (straight horizontal at y=332) -->
        <line x1="456" y1="332" x2="520" y2="332" stroke="#47525E" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="462" y="310" width="52" height="14" rx="2" fill="#F4F1EA"/>
        <text x="488" y="320" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text>

        <!-- Local MCP Server -> AI Assistant (straight vertical at x=596) -->
        <line x1="596" y1="376" x2="596" y2="424" stroke="#47525E" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="508" y="392" width="80" height="14" rx="2" fill="#F4F1EA"/>
        <text x="548" y="402" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BOUNDED RESULT</text>

        <!-- Local MCP Server -> OpenAI API (optional, dashed; right then up into the bottom edge) -->
        <path d="M 672,332 H 872 Q 880,332 880,324 V 200" fill="none" stroke="#1B5E63" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="756" y="340" width="160" height="48" rx="2" fill="#EEEDE6"/>
        <text x="836" y="352" fill="#1B5E63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OPTIONAL</text>
        <text x="836" y="368" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">search query or draft brief</text>
        <text x="836" y="382" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10/11 tools work offline</text>

        <!-- NODES (painted after connectors) -->
        <!-- 1. Curated Folder -->
        <rect x="44" y="88" width="168" height="72" rx="6" fill="#F4F1EA"/>
        <rect x="44" y="88" width="168" height="72" rx="6" fill="#F4F1EA" stroke="#1D232A" stroke-width="1"/>
        <rect x="52" y="96" width="40" height="12" rx="2" fill="none" stroke="rgba(29,35,42,0.35)" stroke-width="0.8"/>
        <text x="72" y="105" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FOLDER</text>
        <text x="128" y="128" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Curated Folder</text>
        <text x="128" y="144" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">your documents</text>

        <!-- 2. Build Cache -->
        <rect x="44" y="184" width="168" height="72" rx="6" fill="#F4F1EA"/>
        <rect x="44" y="184" width="168" height="72" rx="6" fill="#E9E4D8" stroke="#47525E" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="52" y="192" width="38" height="12" rx="2" fill="none" stroke="rgba(71,82,94,0.40)" stroke-width="0.8"/>
        <text x="71" y="201" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="128" y="224" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Build Cache</text>
        <text x="128" y="240" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reused renders &amp; calls</text>

        <!-- 3. Snapshot Builder -->
        <rect x="272" y="100" width="184" height="96" rx="6" fill="#F4F1EA"/>
        <rect x="272" y="100" width="184" height="96" rx="6" fill="#F4F1EA" stroke="#1D232A" stroke-width="1.2"/>
        <rect x="280" y="108" width="36" height="12" rx="2" fill="none" stroke="rgba(29,35,42,0.35)" stroke-width="0.8"/>
        <text x="298" y="117" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
        <text x="364" y="152" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Snapshot Builder</text>
        <text x="364" y="170" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">arkive-rag build</text>

        <!-- 4. Read-Only Snapshot (FOCAL ACCENT) -->
        <rect x="272" y="288" width="184" height="88" rx="6" fill="#F4F1EA"/>
        <rect x="272" y="288" width="184" height="88" rx="6" fill="rgba(176,63,27,0.08)" stroke="#B03F1B" stroke-width="1.5"/>
        <rect x="280" y="296" width="32" height="12" rx="2" fill="none" stroke="rgba(176,63,27,0.45)" stroke-width="0.8"/>
        <text x="296" y="305" fill="#B03F1B" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
        <text x="364" y="336" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Read-Only Snapshot</text>
        <text x="364" y="354" fill="#B03F1B" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">*.arkive.db · mode 0600</text>

        <!-- 5. Local MCP Server -->
        <rect x="520" y="288" width="152" height="88" rx="6" fill="#F4F1EA"/>
        <rect x="520" y="288" width="152" height="88" rx="6" fill="#F4F1EA" stroke="#1D232A" stroke-width="1.2"/>
        <rect x="528" y="296" width="32" height="12" rx="2" fill="none" stroke="rgba(29,35,42,0.35)" stroke-width="0.8"/>
        <text x="544" y="305" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="596" y="332" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Local MCP Server</text>
        <text x="596" y="348" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stdio · HTTP 127.0.0.1</text>
        <text x="596" y="362" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no generative LLM calls</text>

        <!-- 6. AI Assistant -->
        <rect x="520" y="424" width="152" height="72" rx="6" fill="#F4F1EA"/>
        <rect x="520" y="424" width="152" height="72" rx="6" fill="#E9E4D8" stroke="#1D232A" stroke-width="1"/>
        <rect x="528" y="432" width="42" height="12" rx="2" fill="none" stroke="rgba(29,35,42,0.35)" stroke-width="0.8"/>
        <text x="549" y="441" fill="#47525E" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="596" y="464" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AI Assistant</text>
        <text x="596" y="480" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">your MCP client</text>

        <!-- 7. OpenAI API (external) -->
        <rect x="752" y="96" width="168" height="104" rx="6" fill="#F4F1EA"/>
        <rect x="752" y="96" width="168" height="104" rx="6" fill="rgba(27,94,99,0.06)" stroke="#1B5E63" stroke-width="1"/>
        <rect x="760" y="104" width="38" height="12" rx="2" fill="none" stroke="rgba(27,94,99,0.45)" stroke-width="0.8"/>
        <text x="779" y="113" fill="#1B5E63" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
        <text x="836" y="152" fill="#1D232A" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenAI API</text>
        <text x="836" y="170" fill="#47525E" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">external service</text>

        <!-- LEGEND STRIP (bottom) -->
        <line x1="24" y1="548" x2="936" y2="548" stroke="rgba(29,35,42,0.14)" stroke-width="0.8"/>
        <text x="24" y="572" fill="#47525E" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="96" y="562" width="14" height="12" rx="3" fill="#F4F1EA" stroke="#1D232A" stroke-width="1"/>
        <text x="118" y="572" fill="#1D232A" font-size="9" font-family="'Geist', system-ui, sans-serif">Local data and process</text>

        <rect x="276" y="562" width="14" height="12" rx="3" fill="rgba(176,63,27,0.08)" stroke="#B03F1B" stroke-width="1.2"/>
        <text x="298" y="572" fill="#1D232A" font-size="9" font-family="'Geist', system-ui, sans-serif">Read-only snapshot</text>

        <line x1="440" y1="568" x2="468" y2="568" stroke="#1B5E63" stroke-width="1.4"/>
        <text x="476" y="572" fill="#1D232A" font-size="9" font-family="'Geist', system-ui, sans-serif">Build-time external call</text>

        <line x1="648" y1="568" x2="676" y2="568" stroke="#1B5E63" stroke-width="1.1" stroke-dasharray="5,4"/>
        <text x="684" y="572" fill="#1D232A" font-size="9" font-family="'Geist', system-ui, sans-serif">Optional call; 10/11 tools offline</text>
      </svg>
    </div>
  </div>
</body>
</html>
